<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    body { font-family: sans-serif; background: #0d1117; color: #fff; text-align: center; padding-top: 50px; }
    .card { background: #161b22; padding: 25px; width: 300px; margin: auto; border-radius: 10px; border: 1px solid #30363d; }
    input { padding: 8px; width: 80%; margin-bottom: 10px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 4px; }
    button { padding: 8px 15px; background: #238636; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Weather App 🌤️</h2>
    <input type="text" id="city" placeholder="Enter city...">
    <button onclick="getW()">Search</button>
    <div id="res" style="margin-top:15px;"></div>
  </div>
  <script>
    async function getW() {
      let c = document.getElementById('city').value;
      let out = document.getElementById('res');
      if(!c) return;
      out.innerText = "Loading...";
      try {
        let g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${c}`);
        let gd = await g.json();
        let { latitude, longitude, name } = gd.results[0];
        let w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
        let wd = await w.json();
        out.innerHTML = `<b>${name}</b>: ${wd.current_weather.temperature}°C`;
      } catch(e) { out.innerText = "Not found"; }
    }
  </script>
</body>
</html>
